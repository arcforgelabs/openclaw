# Arc Forge rehearsal infrastructure; never upstream.
name: Arc Forge bot source
on:
  pull_request:
    paths:
      - ".arcforge/**"
      - ".github/workflows/arcforge-*"
  push:
    branches: [master]
    paths:
      - ".arcforge/**"
      - ".github/workflows/arcforge-*"
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test .arcforge/test/*.test.mjs
